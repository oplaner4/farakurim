allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
# typescript-eslint pins minimatch ^10, whose denial of service advisory (Dependabot alert #27) is fixed only in 11.0.1.
# Remove once @typescript-eslint/typescript-estree depends on minimatch ^11 itself.
overrides:
  "@typescript-eslint/typescript-estree>minimatch": ^11.0.5
# eslint-config-next pulls in these plugins, whose peer ranges stop at ESLint 9 although they run on ESLint 10 (ESLint 9
# is no longer supported). Remove an entry once that plugin's release declares ESLint 10.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"
