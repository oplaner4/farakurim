<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Lightbox – fotografie – mobil, tmavý režim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1118}
a{color:#FFFFFF}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-label="Fotografie z alba Stánek farnosti na Medovém dni" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B1118; color: #FFFFFF; font-family: Oxygen, 'Segoe UI', 'Helvetica Neue', sans-serif; font-size: 16px; line-height: 1.5; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px">
    <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.3">
      <span aria-live="polite" style="font-size: 15px; font-weight: 700">{{counter}}</span>
      <span style="font-size: 14px; color: #C3CCD8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Stánek farnosti na Medovém dni</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="https://www.zonerama.com/FarnostKurim/425053" aria-label="Otevřít album na Zonerama (nové okno)" style="flex: none; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></a>
      <a href="/fotogalerie" aria-label="Zavřít (Esc)" style="flex: none; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
  </div>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0"><div role="img" aria-label="{{alt}}" style="width: 100%; max-width: none; aspect-ratio: 4 / 3; max-height: 100%; border-radius: 4px; background: {{bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #3A4656"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg><span style="font-size: 15px; font-weight: 700">[foto {{no}} – plná velikost]</span></div></div>
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 28px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <button type="button" aria-label="Předchozí fotografie" onClick="{{prev}}" style="flex: none; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <span style="font-size: 14px; color: #C3CCD8; text-align: center">20. září 2026</span>
      <button type="button" aria-label="Další fotografie" onClick="{{next}}" style="flex: none; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
    <span style="font-size: 13px; color: #9AA6B5; text-align: center">Přejeďte prstem pro další fotografii</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const N = 12, i = st.i != null ? st.i : 2;
    const tints = ['#E8F6EE', '#DCEBF8', '#FFEBCC', '#FBE0EA'];
    const go = (k) => this.setState({ i: (k + N) % N });
    const from = Math.max(0, Math.min(N - 9, i - 4));
    const thumbs = [];
    for (let k = from; k < from + 9; k++) thumbs.push({ label: 'Fotografie ' + (k + 1), cur: k === i ? 'true' : 'false', bd: k === i ? '#FFFFFF' : 'transparent', bg: tints[k % 4], op: k === i ? '1' : '0.6', go: () => go(k) });
    return {
      counter: (i + 1) + ' / ' + N, no: i + 1, bg: tints[i % 4],
      alt: 'Stánek farnosti na Medovém dni, fotografie ' + (i + 1),
      prev: () => go(i - 1), next: () => go(i + 1), thumbs: thumbs
    };
  }
}
</script>
</body>
</html>
