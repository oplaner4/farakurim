<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Lightbox – tým tábora – tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1118}
a{color:#FFFFFF}
</style>
<style>
[data-tip]{position:relative}[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);right:0;z-index:40;padding:7px 11px;border-radius:8px;background:#FFFFFF;color:#0B1118;font:700 14px/1.3 Oxygen,'Segoe UI',sans-serif;letter-spacing:0;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}[data-tip]::before{content:'';position:absolute;top:100%;right:calc(50% - 5px);z-index:40;border:5px solid transparent;border-bottom-color:#FFFFFF;pointer-events:none;opacity:0;transition:opacity .12s}@media (hover:hover){[data-tip]:hover::after,[data-tip]:hover::before{opacity:1;transition-delay:.4s}}[data-tip]:focus-visible::after,[data-tip]:focus-visible::before{opacity:1}[data-tip-pos~=start]::after{right:auto;left:0}[data-tip-pos~=start]::before{right:auto;left:calc(50% - 5px)}[data-tip-pos~=center]::after{right:auto;left:50%;transform:translateX(-50%)}[data-tip-pos~=top]::after{top:auto;bottom:calc(100% + 10px)}[data-tip-pos~=top]::before{top:auto;bottom:100%;border-bottom-color:transparent;border-top-color:#FFFFFF}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-label="Fotografie vedoucích tábora" style="width: 834px; height: 1112px; box-sizing: border-box; display: flex; flex-direction: column; background: #0B1118; color: #FFFFFF; font-family: Oxygen, 'Segoe UI', 'Helvetica Neue', sans-serif; font-size: 16px; line-height: 1.5; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 24px">
    <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.3">
      <span aria-live="polite" style="font-size: 15px; font-weight: 700">{{counter}}</span>
      <span style="font-size: 14px; color: #C3CCD8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{name}}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="/farni_tabor/vedouci" aria-label="Zavřít (Esc)" data-tip="Zavřít (Esc)" style="flex: none; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 0 24px">
    <button type="button" aria-label="Předchozí osoba" data-tip="Předchozí osoba" data-tip-pos="start" onClick="{{prev}}" style="flex: none; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <div role="img" aria-label="{{alt}}" style="width: 100%; max-width: 520px; aspect-ratio: 4 / 5; max-height: 100%; border-radius: 8px; background: {{bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #3A4656"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg><span style="font-size: 15px; font-weight: 700">[foto – {{name}}]</span></div>
    <button type="button" aria-label="Další osoba" data-tip="Další osoba" onClick="{{next}}" style="flex: none; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 24px 32px">
    <span style="font-size: 15px; color: #C3CCD8; text-align: center">{{caption}}</span>
    
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1112}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const T = [['Honza', 'Hlavní vedoucí', '22 let'], ['Bára', 'Zdravotnice', '18 let'], ['Michal', 'Vedoucí', '22 let'], ['Tomáš', 'Vedoucí', '22 let'], ['Simča', 'Vedoucí', '19 let'], ['Šimon', 'Vedoucí', '20 let'], ['Kuba D.', 'Vedoucí', '17 let'], ['Anička', 'Praktikantka', '16 let'], ['Kuba C.', 'Praktikant', '17 let'], ['Pája', 'Praktikantka', '16 let'], ['Agi', 'Praktikantka', '16 let'], ['Kuba S.', 'Praktikant', '15 let'], ['Áďa', 'Praktikantka', '16 let'], ['Vanda', 'Praktikantka', '15 let'], ['David', 'Praktikant', '16 let']];
    const N = T.length, i = st.i != null ? st.i : 0;
    const tints = ['#FDEEF3', '#DCEBF8', '#E8F6EE', '#FFEBCC'];
    const go = (k) => this.setState({ i: (k + N) % N });
    const p = T[i];
    const from = Math.max(0, Math.min(N - 9, i - 4));
    const thumbs = [];
    for (let k = from; k < from + 9; k++) thumbs.push({ label: T[k][0], cur: k === i ? 'true' : 'false', bd: k === i ? '#FFFFFF' : 'transparent', bg: tints[k % 4], op: k === i ? '1' : '0.6', go: () => go(k) });
    return {
      counter: (i + 1) + ' / ' + N, name: p[0], role: p[1], bg: tints[i % 4],
      caption: p[0] + ' · ' + p[1] + (p[2] ? ' · ' + p[2] : ''),
      alt: 'Fotografie: ' + p[0] + ', ' + p[1].toLowerCase(),
      prev: () => go(i - 1), next: () => go(i + 1), thumbs: thumbs
    };
  }
}
</script>
</body>
</html>
