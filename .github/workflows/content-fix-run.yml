# Fixes a content PR (a `service-sheet/*` or `events/*` PR of this repo) from the `/fix` comments in its
# conversation (docs/content-pipelines.md "Fixing content PRs with comments"). content-fix.yml dispatches it on main for each
# picked-up comment; one run per PR at a time (a newer pending run replaces an older one), and each run answers the
# PR's oldest unanswered comment: one from a commenter with write access that no bot reply names by its marker
# (`<!-- content-fix: <comment id> -->`). So no comment is lost when a pending run is cancelled, and a comment is
# answered once, success, refusal and failure alike (a failed comment is written again, never retried).
# Two jobs per comment, so that no step holding a secret runs code from a workspace the agent has touched:
# - `fix` reads the PR (`pnpm content-fix next`: open, kind, head and the comment, from main's code before anything
#   else) and, for a request, downloads the PR's JSON report (`pnpm content-pr stored`: the `content-report-<sha>`
#   artifact of its newest commit that has one; none, or one of another version, and the reply says to close the PR
#   and send the sheet or event again), the PR's staged files (the `content-uploads-<sha>` artifacts of its commits,
#   applied in commit order into the staging folder), the failed `check` run's log and, for events, the known events.
#   It then checks out the PR's head and lets the agent (workload identity federation, no API key) run
#   the kind's correction skill as a comment run: the comment, the PR's report and the check's log are its only input,
#   the rest of the thread never reaches it. It corrects the report (`report.json`) in place and writes the fix result
#   (`fix.json`: the outcome, the fix's commit message and the reply), checked with `pnpm content-pr check`. The
#   agent's file tools may write only in $RUNNER_TEMP/fix (the checkout is denied); only the stage and replace scripts
#   write src/content/ and the staging folder. The job hands on the report, the fix result, the change to src/content/
#   as a patch, the staged files that are new or changed, and the known events as a one-day artifact. Its token is
#   read-only and it has no App key.
# - `publish` starts from a fresh checkout of the head `fix` read before the agent ran, so the code it runs is the PR's
#   own, never the agent's workspace. `pnpm content-pr apply` checks the fix result's outcome against the patch,
#   applies the patch only if it touches nothing but the kind's files, and checks the report against the whole PR; it
#   then refuses an id an open events PR holds, reads the PR again (merged, closed or moved since `fix` read it:
#   nothing is pushed), commits as the GitHub App's bot, uploads the changed staged files as `content-uploads-<sha>`
#   (so the content release finds them) and the report as `content-report-<sha>` (so the next run reads it back) and
#   only then pushes without force (a branch moved meanwhile rejects it), so no pushed commit lacks its files or its
#   report. Without a change, the report is uploaded again for the head (the newest run wins). It updates the PR's body
#   and title from the report and turns it back into a draft on a blocking question. It neither tests nor builds:
#   check.yml does that on the pushed commit. It has no id-token, so it cannot act as the agent. It always replies to
#   the comment (the fix result's reply, or the failure with the run's link, never the comment's or a file's content),
#   with the marker.
# While unanswered comments remain and the reply was posted, `next` dispatches the workflow again, up to 10 runs per
# start (a reply that failed would leave its comment unanswered, to be applied again by every next run). Both jobs run
# in the environment `content-fix` (the federation rule `ANTHROPIC_FEDERATION_RULE_ID`, which matches it; only `fix`
# has an id-token). The App key is the repository secret CONTENT_APP_PRIVATE_KEY, shared with the other content
# workflows. The runner image and the actions are pinned (actions by commit SHA).

name: Content fix

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The content PR's number
        required: true
      chain:
        description: The run's place in a chain started by a comment (at most 10)
        default: "1"

# One run per PR at a time, never cancelled mid-run, so each comment starts from the head the previous one pushed.
concurrency:
  group: content-fix-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read

# The copy a test checks: the folder of the uploaded files (UPLOADS_PATH in src/lib/shared/uploads.ts), without its
# slashes.
env:
  UPLOADS: uploads

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 50 # The agent's step has 30 of them
    environment: content-fix
    permissions:
      contents: read
      pull-requests: read # the PR, its comments, the open events PRs
      actions: read # the PR's artifacts and the check's log
      checks: read # the head commit's check run
      id-token: write # The agent's workload identity federation
    # Read by the `next` step, before the agent's: never read back from files the agent could have changed. `comment` is
    # set only for an open content PR with a request, and `publish` runs only then.
    outputs:
      comment: ${{ steps.next.outputs.comment }}
      kind: ${{ steps.next.outputs.kind }}
      head: ${{ steps.next.outputs.head }}
      branch: ${{ steps.next.outputs.branch }}
      remaining: ${{ steps.next.outputs.remaining }}
      report_missing: ${{ steps.report.outputs.missing }}
      artifacts: ${{ steps.artifacts.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the PR's head, the events PRs' branches and their merge bases
          persist-credentials: false # nothing here pushes

      - uses: ./.github/actions/setup

      # One JSON document on stdout: the PR's state, kind, head, branch, the comment's id and the requests after it,
      # never the comment's text, which goes to $RUNNER_TEMP/fix/comment.md. The kind picks the skill and the scripts
      # the agent may run (and its check of the report).
      - name: Read the PR
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          mkdir -p "$RUNNER_TEMP/fix" "$RUNNER_TEMP/run"
          next=$(pnpm --silent content-fix next --pr "$PR" --out "$RUNNER_TEMP/fix")
          if [ "$(jq -r '.open and .kind != null and .comment != null' <<< "$next")" != true ]; then
            echo "Nothing to answer: the PR is closed, not a content PR of this repo, or has no unanswered comment."
            exit 0
          fi
          head=$(jq -r .head <<< "$next")
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The PR's head is not a commit id."
            exit 1
          fi
          kind=$(jq -r .kind <<< "$next")
          case "$kind" in
            events)
              skill=parish-correct-event label=events
              commands=$'pnpm replace-event:*\npnpm event-poster:*\npnpm stage event:*\npnpm venue find:*\npnpm venue lookup:*\npnpm venue add:*\npnpm venue alias:*'
              ;;
            sheet)
              skill=parish-correct-service-sheet label="service sheets"
              commands="pnpm replace-sheet:*"
              ;;
          esac
          commands+=$'\npnpm content-pr check:*'
          {
            jq -r '"comment=\(.comment)", "branch=\(.branch)", "remaining=\(.remaining)"' <<< "$next"
            echo "kind=$kind"
            echo "head=$head"
            echo "skill=$skill"
            echo "label=$label"
            printf 'commands<<COMMANDS\n%s\nCOMMANDS\n' "$commands"
          } >> "$GITHUB_OUTPUT"

      # From main's code, before the head is checked out: the PR's report, checked with main's schema, for the agent
      # to correct in place. None (an expired artifact, a PR from before the JSON reports) or one of another version
      # fails the run, and the reply says to close the PR and send the sheet or event again.
      - name: Download the PR's report
        id: report
        if: steps.next.outputs.comment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          KIND: ${{ steps.next.outputs.kind }}
        run: |
          stored="$RUNNER_TEMP/stored"
          found=$(pnpm --silent content-pr stored --pr "$PR")
          if [ -n "$found" ]; then
            read -r id name <<< "$found"
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n "$name" -D "$stored"
          fi
          if [ ! -f "$stored/report.json" ] \
            || ! pnpm --silent content-pr check --kind "$KIND" "$stored/report.json"; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::error::The PR's report is missing or from another version: close the PR and send the sheet or" \
              "event again."
            exit 1
          fi
          cp "$stored/report.json" "$RUNNER_TEMP/fix/report.json"

      # From main's code, before the head is checked out: the staged files land in the staging folder, which git
      # ignores, so the checkout keeps them. `apply` checks each file lies in the kind's folder, as the release does;
      # an expired artifact fails the step, and the reply says so.
      - name: Download the staged files
        id: artifacts
        if: steps.next.outputs.comment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          KIND: ${{ steps.next.outputs.kind }}
        run: |
          artifacts="$RUNNER_TEMP/artifacts"
          mkdir -p "$artifacts"
          pnpm --silent content-fix artifacts --pr "$PR" --kind "$KIND" > "$RUNNER_TEMP/artifacts.txt"
          while read -r id name; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n "$name" -D "$artifacts/$name"
          done < "$RUNNER_TEMP/artifacts.txt"
          pnpm --silent content-fix apply --pr "$PR" --kind "$KIND" --order "$RUNNER_TEMP/artifacts.txt" "$artifacts"
          rm -rf "$artifacts"

      # The failed steps of the head's `check` run (repo and published content only), so "fix the failing check"
      # works; none when it passed.
      - name: Read the check
        if: steps.next.outputs.comment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.next.outputs.head }}
        run: pnpm --silent content-fix check-log --sha "$HEAD_SHA" --out "$RUNNER_TEMP/fix/check.md"

      # Before the agent's step, into the artifact's folder: `publish` checks new ids against it.
      - name: List the known events
        if: steps.next.outputs.comment != '' && steps.next.outputs.kind == 'events'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --silent event-mail known --out "$RUNNER_TEMP/run/known.json"

      # The PR's head as `next` read it: a push since then fails `publish`'s push. The staging folder's sums tell the
      # files the agent's run stages from those it found.
      - name: Check out the PR
        if: steps.next.outputs.comment != ''
        env:
          HEAD_SHA: ${{ steps.next.outputs.head }}
        run: |
          git fetch --quiet origin "$HEAD_SHA"
          git checkout --quiet --detach "$HEAD_SHA"
          pnpm install --frozen-lockfile
          mkdir -p "$UPLOADS"
          find "$UPLOADS" -type f -exec sha256sum {} + > "$RUNNER_TEMP/run/uploads.sum"

      - name: Install poppler
        if: steps.next.outputs.comment != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      # The prompt holds no content rules and never the comment: they live in the skill's "Comment run" section (with
      # the contract it follows, .claude/content-pr/comment-run.md) and in comment.md. What the agent may do: .github/actions/agent, with the kind's stage and replace scripts.
      - name: Run the correction skill
        id: agent
        if: steps.next.outputs.comment != ''
        timeout-minutes: 30
        uses: oplaner4/farakurim/.github/actions/agent@main # from main, not the checkout: see the action
        # The venue lookups' key; a comment run may add a venue or an alias, which the PR's review confirms.
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
        with:
          workdir: ${{ runner.temp }}/fix
          commands: ${{ steps.next.outputs.commands }}
          tier: light # a narrow edit the maintainer reviews at once
          federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          prompt: |
            A maintainer commented on this ${{ steps.next.outputs.label }} PR. Run ${{ steps.next.outputs.skill }} as a
            comment run (its "Comment run" section). The input is ${{ runner.temp }}/fix (comment.md, report.json,
            check.md when present). Correct the PR's report ${{ runner.temp }}/fix/report.json in place and write the
            fix result to ${{ runner.temp }}/fix/fix.json, then run
            `pnpm content-pr check --kind ${{ steps.next.outputs.kind }} --fix ${{ runner.temp }}/fix/fix.json ${{ runner.temp }}/fix/report.json`
            until it passes. The scratchpad is ${{ runner.temp }}/fix. Don't read README.md, docs/ or design/.

      # What `publish` needs, never the comment: the report and the fix result, the change to src/content/ against the
      # head (new files included) and the staged files that are new or whose content changed (a renamed, relabelled or
      # re-rendered file), at their paths under the staging folder.
      - name: Collect the outcome
        if: always() && steps.next.outputs.comment != ''
        run: |
          run="$RUNNER_TEMP/run"
          for file in report.json fix.json; do
            if [ -f "$RUNNER_TEMP/fix/$file" ]; then cp "$RUNNER_TEMP/fix/$file" "$run/$file"; fi
          done
          git add --intent-to-add -- src/content
          git diff --binary HEAD -- src/content > "$run/content.patch"
          mkdir -p "$UPLOADS"
          find "$UPLOADS" -type f -exec sha256sum {} + | sort | comm -13 <(sort "$run/uploads.sum") - | cut -c67- \
            | while IFS= read -r file; do cp --parents -- "$file" "$run/"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.next.outputs.comment != ''
        with:
          name: content-fix-${{ github.run_id }}
          path: ${{ runner.temp }}/run/
          if-no-files-found: error
          retention-days: 1

      - name: Delete the input
        if: always()
        run: rm -rf "$RUNNER_TEMP/fix"

  publish:
    needs: fix
    if: always() && needs.fix.outputs.comment != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: content-fix
    permissions:
      contents: read # the push, the PR and the reply use the App token
    outputs:
      posted: ${{ steps.reply.outputs.posted }}
    steps:
      # Missing when `fix` failed before handing on: this job then only replies.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true
        with:
          name: content-fix-${{ github.run_id }}
          path: ${{ runner.temp }}/run/

      # A fresh checkout of the head `fix` read before the agent ran: nothing from `fix`'s workspace runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.download.outcome == 'success'
        with:
          ref: ${{ needs.fix.outputs.head }}
          fetch-depth: 0 # origin/main and the PR's merge base with it
          persist-credentials: false # only the push step gets a token

      - uses: ./.github/actions/setup
        if: steps.download.outcome == 'success'

      # `pnpm content-pr apply` reads the corrected report and the fix result (whose outcome must agree with the
      # patch), applies the patch only if it touches nothing but the kind's files (sheets: src/content/*.json; events:
      # the news month files and the venue list, which only gains venues and aliases) and checks the report against the
      # whole PR (from its merge base with origin/main, fetched here); otherwise it fails and nothing is applied. It
      # writes the report to $RUNNER_TEMP/publish/report.json and gives `{ changed, draft, message, fix? }`: the PR's
      # title and the fix's commit message, both accepted by commitlint (a default otherwise). No id the change adds
      # may be held by an open events PR (this PR's own events are on its head already). The PR body (`pnpm content-pr
      # body`) ends with the Události lines that need a person for events, as events.yml builds them, and the footer.
      - name: Apply the change
        id: apply
        if: steps.download.outcome == 'success' && needs.fix.result == 'success'
        env:
          KIND: ${{ needs.fix.outputs.kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ vars.GOOGLE_CALENDAR_API_KEY }}
        run: |
          run="$RUNNER_TEMP/run"
          out="$RUNNER_TEMP/publish"
          patch="$run/content.patch"
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! result=$(pnpm --silent content-pr apply --kind "$KIND" --fix "$run/fix.json" --base origin/main \
            --out "$out" "$run/report.json" "$patch"); then
            echo "::error::The report or the change was not accepted (see above)."
            exit 1
          fi
          changed=$(jq -r .changed <<< "$result")
          if [ "$changed" = true ] && [ "$KIND" = events ]; then
            pnpm --silent event-mail check-ids "$run/known.json"
          fi
          uploads=false
          if [ "$changed" = true ] && [ -n "$(find "$run/$UPLOADS" -type f 2> /dev/null)" ]; then uploads=true; fi
          {
            echo "changed=$changed"
            echo "blocking=$(jq -r .draft <<< "$result")"
            echo "fix=$(jq -r '.fix // ""' <<< "$result")"
            echo "title=$(jq -r .message <<< "$result")"
            echo "uploads=$uploads"
          } >> "$GITHUB_OUTPUT"
          : > "$out/calendar.txt"
          if [ "$KIND" = events ]; then
            pnpm --silent calendar-sync --calendar events --problems > "$out/calendar.txt" 2> /dev/null || true
          fi
          pnpm --silent content-pr body --kind "$KIND" --fix --run-url "$RUN_URL" --calendar "$out/calendar.txt" \
            "$out/report.json" > "$out/pr-body.md"

      # Also for the reply when anything before failed.
      - name: Create the App token
        id: app
        if: always()
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_APP_PRIVATE_KEY }}
          # Not all of the App's permissions: the push, editing the PR, the reply and locking.
          permission-contents: write
          permission-pull-requests: write

      # src/content/ only: the staged files are in the staging folder, which git ignores. No hooks (the message is
      # checked already). The PR is read again first: one merged, closed or moved since `fix` read it gets no commit,
      # and the reply asks for the comment again.
      - name: Commit
        id: commit
        if: steps.apply.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ needs.fix.outputs.head }}
          MESSAGE: ${{ steps.apply.outputs.fix }}
        run: |
          pull=$(GH_TOKEN="$TOKEN" gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefOid)
          if [ "$(jq -r .state <<< "$pull")" != OPEN ] || [ "$(jq -r .headRefOid <<< "$pull")" != "$HEAD_SHA" ]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The PR was merged, closed or moved since the fix read it: nothing pushed."
            exit 0
          fi
          bot="${APP_SLUG}[bot]"
          id=$(GH_TOKEN="$TOKEN" gh api "/users/$bot" --jq .id)
          git add -- src/content
          git -c core.hooksPath=/dev/null -c user.name="$bot" -c user.email="$id+$bot@users.noreply.github.com" \
            commit -m "$MESSAGE"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Before the push, so no pushed commit lacks its staged files: a failed upload pushes nothing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: uploads
        if: steps.commit.outputs.sha != '' && steps.apply.outputs.uploads == 'true'
        with:
          name: content-uploads-${{ steps.commit.outputs.sha }}
          path: ${{ runner.temp }}/run/${{ env.UPLOADS }}/
          if-no-files-found: error
          retention-days: 30

      # The report of the new commit, before the push for the same reason: the next run reads it back.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: report
        if: steps.commit.outputs.sha != ''
        with:
          name: content-report-${{ steps.commit.outputs.sha }}
          path: ${{ runner.temp }}/publish/report.json
          if-no-files-found: error
          retention-days: 30

      # Never a force-push: a branch moved since `Commit` read it rejects the push, and the reply asks for the comment
      # again. (A rejected push leaves an artifact no commit names: the release never reads it.)
      - name: Push
        id: push
        if: steps.commit.outputs.sha != ''
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ needs.fix.outputs.branch }}
          HEAD_SHA: ${{ needs.fix.outputs.head }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push "$remote" "HEAD:refs/heads/$BRANCH"; then
            now=$(git ls-remote "$remote" "refs/heads/$BRANCH" | cut -f1)
            if [ "$now" != "$HEAD_SHA" ]; then echo "moved=true" >> "$GITHUB_OUTPUT"; fi
            echo "::error::The push was rejected."
            exit 1
          fi

      # Also without a change (an answer, a refusal): the report may have changed. The title is `apply`'s message; an
      # open blocking question turns a ready PR back into a draft, none leaves the draft state as it is (the
      # maintainer marks it ready).
      - name: Update the PR
        id: pr
        if: >-
          steps.apply.outcome == 'success'
          && (steps.apply.outputs.changed != 'true' || steps.push.outcome == 'success')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pr }}
          TITLE: ${{ steps.apply.outputs.title }}
          BLOCKING: ${{ steps.apply.outputs.blocking }}
        run: |
          body="$RUNNER_TEMP/publish/pr-body.md"
          pull=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,isDraft)
          if [ "$(jq -r .body <<< "$pull")" != "$(cat "$body")" ] || [ "$(jq -r .title <<< "$pull")" != "$TITLE" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$body"
          fi
          if [ "$BLOCKING" = true ] && [ "$(jq -r .isDraft <<< "$pull")" != true ]; then
            gh pr ready --undo "$PR" --repo "$GITHUB_REPOSITORY"
          fi

      # Without a commit, the corrected report (an answer, a refusal) is stored again for the head: a newer run of the
      # same name wins when the next run reads it back.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: stored
        if: steps.pr.outcome == 'success' && steps.apply.outputs.changed != 'true'
        with:
          name: content-report-${{ needs.fix.outputs.head }}
          path: ${{ runner.temp }}/publish/report.json
          if-no-files-found: error
          retention-days: 30

      # Always, so the comment is answered once: the fix result's reply, or why it failed, never the comment's or a
      # file's content. The marker names the comment, so no later run answers it again. The conversation is locked and
      # even the App cannot comment on it, so it is unlocked for the reply and locked again (as content-release.yml
      # does).
      # `posted` lets `next` go on: a comment left unanswered would be taken, and applied, again by every next run.
      - name: Reply
        id: reply
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pr }}
          COMMENT: ${{ needs.fix.outputs.comment }}
          ARTIFACTS: ${{ needs.fix.outputs.artifacts }}
          REPORT_MISSING: ${{ needs.fix.outputs.report_missing }}
          MOVED: ${{ steps.commit.outputs.moved || steps.push.outputs.moved }}
          UPLOADS_OUTCOME: ${{ steps.uploads.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          STORED_OUTCOME: ${{ steps.stored.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          CHANGED: ${{ steps.apply.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reply="$RUNNER_TEMP/reply.md"
          if [ "$PR_OUTCOME" = success ] && [ "$STORED_OUTCOME" = failure ]; then
            outcome="answered, but the report was not stored"
            echo "The PR was updated, but its report could not be stored, so the next fix would not see this one:" \
              "write the comment again. Run: $RUN_URL" > "$reply"
          elif [ "$PR_OUTCOME" = success ]; then
            outcome="answered ($([ "$CHANGED" = true ] && echo changed || echo unchanged))"
            { jq -r .reply "$RUNNER_TEMP/run/fix.json"; echo; echo "Run: $RUN_URL"; } > "$reply"
          elif [ "$MOVED" = true ]; then
            outcome="the PR changed or was merged meanwhile"
            echo "The PR changed or was merged meanwhile: write the comment again if it still applies." \
              "Run: $RUN_URL" > "$reply"
          elif [ "$PUSH_OUTCOME" = success ]; then
            outcome="changed, but the PR was not updated"
            echo "The fix was pushed, but the PR's body or title could not be updated: $RUN_URL" > "$reply"
          elif [ "$UPLOADS_OUTCOME" = failure ]; then
            outcome="the staged files could not be uploaded"
            echo "The fix failed: its staged files could not be uploaded, so nothing was pushed: $RUN_URL" > "$reply"
          elif [ "$REPORT_OUTCOME" = failure ]; then
            outcome="the report could not be uploaded"
            echo "The fix failed: its report could not be uploaded, so nothing was pushed: $RUN_URL" > "$reply"
          elif [ "$REPORT_MISSING" = true ]; then
            outcome="the PR's report is missing or from another version"
            echo "The PR's report is missing or from another version: close the PR and send the sheet or event again." \
              "Run: $RUN_URL" > "$reply"
          elif [ "$ARTIFACTS" = failure ]; then
            outcome="the staged files could not be downloaded"
            echo "The fix failed: the PR's staged files could not be downloaded (an expired artifact means the PR" \
              "has to be recreated): $RUN_URL" > "$reply"
          else
            outcome="failed"
            echo "The fix failed: $RUN_URL" > "$reply"
          fi
          { echo; echo "<!-- content-fix: $COMMENT -->"; } >> "$reply"
          echo "Comment $COMMENT on PR #$PR: $outcome." >> "$GITHUB_STEP_SUMMARY"
          issue="repos/$GITHUB_REPOSITORY/issues/$PR"
          gh api -X DELETE "$issue/lock" > /dev/null || true
          status=0
          gh api "$issue/comments" -F body=@"$reply" > /dev/null || status=$?
          gh api -X PUT "$issue/lock" -f lock_reason=resolved > /dev/null || true
          if [ "$status" = 0 ]; then echo "posted=true" >> "$GITHUB_OUTPUT"; fi
          exit "$status"

  # One comment per run: while unanswered comments remain, the next run takes the next one (at most 10 runs per
  # start), only once this run's reply is posted. GITHUB_TOKEN may dispatch a workflow.
  next:
    needs: [fix, publish]
    if: >-
      always() && needs.fix.outputs.remaining != '' && needs.fix.outputs.remaining != '0'
      && needs.publish.outputs.posted == 'true' && fromJSON(inputs.chain) < 10
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # dispatch this workflow
    steps:
      - name: Dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          CHAIN: ${{ inputs.chain }}
        run: |
          gh workflow run content-fix-run.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr="$PR" \
            -f chain=$((CHAIN + 1))
