# Picks up a `/fix` comment on a content PR (docs/content-pipelines.md "Fixing content PRs with comments"). It runs on
# every new comment in a PR conversation; review and inline comments are other events and never start it. The `gate`
# job only filters: an open PR of this repo from a `service-sheet/` or `events/` branch, a comment starting with
# `/fix` from a commenter with write access (the association and the repo permission), never a bot (the App's own
# replies). It adds an eyes reaction (with the App token), so the maintainer sees the comment was picked up, and
# dispatches content-fix-run.yml on main, which does the work: one run per PR at a time, each answering the PR's
# unanswered comments, so a comment whose dispatch was cancelled while pending is still answered.
# The gate is in no concurrency group (every matching comment gets its reaction), checks out nothing and runs no code
# from the repo; the comment's text never reaches a shell. Its token (GITHUB_TOKEN) reads the PR and may dispatch a
# workflow; the App token, created only for an accepted comment, reacts. The runner image and the actions are pinned.

name: Content fix comment

on:
  issue_comment:
    types: [created] # an edited comment does not run again

permissions:
  contents: read

jobs:
  gate:
    # The cheap filters of the event; the PR's branch, its repo and the commenter's permission are read below. An
    # expression has no regex, so `/fixed` passes here too: content-fix-run.yml then finds no request (`isFixRequest`).
    if: >-
      github.event.issue.pull_request && github.event.issue.state == 'open'
      && startsWith(github.event.comment.body, '/fix')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # dispatch content-fix-run.yml
      pull-requests: read # the PR's branch and repo
    steps:
      - name: Check the PR and the commenter
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          branch=$(jq -r .head.ref <<< "$pull")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<< "$pull")
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ] \
            || ! [[ "$branch" == service-sheet/* || "$branch" == events/* ]]; then
            echo "Not a content PR of this repo: nothing to do."
            exit 0
          fi
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)
          if ! [[ "$permission" =~ ^(admin|maintain|write)$ ]]; then
            echo "The commenter has no write access: nothing to do."
            exit 0
          fi
          echo "accepted=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN cannot touch the locked conversation of a content PR (403 even with `issues: write`), so the App
      # token reacts: it unlocks the conversation for the reaction and locks it again, as content-release.yml does for
      # its comments. A failed token or reaction only warns: the fix is dispatched anyway.
      - name: Create the App token
        id: app
        if: steps.gate.outputs.accepted == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONTENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_APP_PRIVATE_KEY }}
          permission-pull-requests: write # the reaction and the lock only

      - name: React to the comment
        if: steps.gate.outputs.accepted == 'true' && steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          issue="repos/$GITHUB_REPOSITORY/issues/$PR"
          gh api -X DELETE "$issue/lock" > /dev/null || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT/reactions" -f content=eyes > /dev/null \
            || echo "::warning::Could not react to the comment."
          gh api -X PUT "$issue/lock" -f lock_reason=resolved > /dev/null || true

      - name: Dispatch the fix
        if: steps.gate.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: gh workflow run content-fix-run.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr="$PR"
