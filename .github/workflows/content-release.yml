# Releases the site when a content PR is merged (docs/deployment.md "Content release"): the maintainer's squash merge of
# a `service-sheet/*` PR (opened by service-sheet.yml) or an `events/*` PR (the events pipeline) is the yes to publish.
# It runs on `pull_request_target: closed`, so a push to main (the maintainer's own content, `pnpm release`) never
# starts it, and every other closed PR only makes a skipped run. Not `pull_request`: an environment's deployment branch
# rule is matched against GITHUB_REF, which is refs/pull/N/merge for a pull request run, while a pull_request_target run
# has main, which Production allows. pull_request_target runs with the secrets even for a fork's PR, so the jobs check
# out main only, never the PR's code, and the `plan` job runs only for a merged PR from a content branch of this repo.
# - `plan` runs `pnpm content-release` (scripts/content-release.ts) on the commits since the last tag. It skips when
#   none of them is a content PR's squash commit and ends green when an earlier run released everything. It stops with
#   a comment on the content PRs, releasing nothing, when main holds a commit only a release by hand may publish (a
#   feat, the content scope, a breaking change or a header that does not parse: the maintainer's own content may have
#   staged files only on their machine, and a feature goes live when they release it; other commits and merge commits
#   go out with the PRs) or when an artifact expired: then the maintainer releases by hand (docs/deployment.md).
#   Only artifacts of runs on this repo's main count: a fork's pull request run can upload an artifact under any name.
# - `release` (environment Production: the SSH key) plans again on the main it checked out, so a merge that landed
#   meanwhile goes out too (or stops it with the reason). It downloads the artifacts of every commit of those PRs and
#   `pnpm content-release apply` copies them into the staging folder, after checking that each file lies in its PR's
#   kind's folder: each content workflow run hands on only the files it staged, and the PRs in merge order, their
#   commits oldest first, let the newest file of a path win. It then checks that every uploaded-file link a PR adds is
#   staged, so a commit the maintainer pushed by hand (a text fix, a resolved conflict) goes out, but one that links a
#   file staged only on their machine stops the release before anything is uploaded or tagged. Then `pnpm release --yes` uploads them, bumps the version,
#   tags and pushes main with the App token, so the tag starts deploy.yml, which checks, builds and deploys unchanged.
#   The job waits for that deploy and comments "Released in vX.Y.Z" on each PR and deletes its branch, or comments the
#   failure. A failed release is fixed in a new commit; never move a tag.
# Two content PRs merged close together go out in one release: the runs queue, and a later one finds nothing to
# release.
# The App key is a repository secret (CONTENT_APP_PRIVATE_KEY, shared with service-sheet.yml); a secret reaches only
# the steps that name it. The runner image and the actions are pinned (actions by commit SHA).

name: Content release

on:
  pull_request_target:
    types: [closed]
    branches: [main] # the PR's base

# One content release at a time, never cancelled mid-release; a newer pending run replaces an older one, and it sees
# every merge. Any other closed PR gets a group of its own, so its skipped run never replaces a content merge's.
concurrency:
  group: >-
    ${{ github.event.pull_request.merged && (startsWith(github.event.pull_request.head.ref, 'service-sheet/')
    || startsWith(github.event.pull_request.head.ref, 'events/'))
    && 'content-release' || format('content-release-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

# The copy a test checks: the site (SITE_URL in src/content/site.ts). Each PR's page comes from the plan.
env:
  SITE: https://farakurim.cz

jobs:
  plan:
    # A merged content PR of this repo only; a fork can name its branch the same.
    if: >-
      github.event.pull_request.merged && (startsWith(github.event.pull_request.head.ref, 'service-sheet/')
      || startsWith(github.event.pull_request.head.ref, 'events/'))
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the PRs of the commits
      actions: read # the artifacts
    outputs:
      action: ${{ steps.plan.outputs.action }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # main, never the PR's code; a run that waited in the queue then sees every merge since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the commits since the last tag
          persist-credentials: false # nothing here pushes

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/plan.json"
          pnpm --silent content-release > "$plan"
          action=$(jq -r .action "$plan")
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "plan=$(jq -c . "$plan")" >> "$GITHUB_OUTPUT"
          case "$action" in
            skip | none) echo "::notice::$(jq -r .reason "$plan")" ;;
            release) echo "Releasing PR(s) $(jq -r '[.pulls[] | "#\(.number)"] | join(", ")' "$plan")." ;;
          esac

      - name: Create the App token
        id: app
        if: steps.plan.outputs.action == 'blocked'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CONTENT_APP_ID }}
          private-key: ${{ secrets.CONTENT_APP_PRIVATE_KEY }}
          permission-pull-requests: write # the comments only

      # The App token: the PR conversation is locked, and only collaborators can comment.
      - name: Report why nothing is released
        if: steps.plan.outputs.action == 'blocked'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PLAN: ${{ steps.plan.outputs.plan }}
        run: |
          reason=$(jq -r .reason <<< "$PLAN")
          for pr in $(jq -r '.pulls[].number' <<< "$PLAN"); do
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "Not released: $reason. Release with \`pnpm release\` by hand once that is sorted out (docs/deployment.md)."
          done
          echo "::error::$reason"
          exit 1

  release:
    needs: plan
    if: needs.plan.outputs.action == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: Production
      url: ${{ env.SITE }}/
    permissions:
      contents: read # the push and the comments use the App token
      pull-requests: read # the PRs of the commits
      actions: read # the artifacts and the deploy run
    env:
      # The plan of `plan`, for the failure comment until this job's own plan exists.
      FIRST_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Create the App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CONTENT_APP_ID }}
          private-key: ${{ secrets.CONTENT_APP_PRIVATE_KEY }}
          # Not all of the App's permissions: pushing main and the tag, deleting the branches, the comments.
          permission-contents: write
          permission-pull-requests: write

      # With the App token persisted: release.sh fetches main and pushes it with the tag, and a push made with the
      # App's token (unlike github.token) starts deploy.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the tags, for the version
          token: ${{ steps.app.outputs.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # main may have moved since `plan` (another merge): the plan of this checkout is the one released. A push after
      # this makes release.sh stop (main behind origin) or its push fail, and nothing is tagged.
      - name: Plan again
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/plan.json"
          pnpm --silent content-release > "$plan"
          action=$(jq -r .action "$plan")
          echo "action=$action" >> "$GITHUB_OUTPUT"
          case "$action" in
            release) echo "Releasing PR(s) $(jq -r '[.pulls[] | "#\(.number)"] | join(", ")' "$plan")." ;;
            blocked)
              echo "reason=$(jq -r .reason "$plan")" >> "$GITHUB_OUTPUT"
              echo "::error::$(jq -r .reason "$plan")"
              exit 1
              ;;
            *) echo "::notice::$(jq -r .reason "$plan")" ;;
          esac

      # The release commit is the App's bot's; the commit-msg hook stays on (chore(release): vX.Y.Z passes it).
      - name: Set the committer
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          bot="${APP_SLUG}[bot]"
          id=$(gh api "/users/$bot" --jq .id)
          git config user.name "$bot"
          git config user.email "$id+$bot@users.noreply.github.com"

      - name: Set up SSH
        if: steps.plan.outputs.action == 'release'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The host key is public, so it may be a variable; the private key must be a secret.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS || vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Set DEPLOY_SSH_KEY (secret) and DEPLOY_KNOWN_HOSTS in the Production environment."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # `apply` checks every file first and copies them in the plan's order, so a later file of the same path (a
      # correction) overwrites an earlier one.
      - name: Download the artifacts
        id: apply
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          jq -r '.pulls[].artifacts[] | "\(.runId) \(.name)"' "$RUNNER_TEMP/plan.json" | while read -r run name; do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" -n "$name" -D "$RUNNER_TEMP/artifacts/$name"
          done
          # A refused file is named in the failure comment.
          if ! out=$(pnpm --silent content-release apply "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/artifacts" 2>&1); then
            printf '%s\n' "$out"
            echo "reason=$(tail -n 1 <<< "$out")" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          printf '%s\n' "$out"

      # Uploads the staged files (and the cron scripts) first, then the version commit and the tag, pushed with main.
      - name: Release
        id: release
        if: steps.plan.outputs.action == 'release'
        run: |
          pnpm release --yes
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for the deploy
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          id=""
          for _ in $(seq 30); do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --commit "$SHA" \
              --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$id" ]; then break; fi
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::No deploy run started for $SHA within 5 minutes."
            exit 1
          fi
          echo "Deploy run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null

      - name: Report the release
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          jq -r '.pulls[] | "\(.number) \(.branch) \(.page)"' "$RUNNER_TEMP/plan.json" | while read -r pr branch page; do
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "Released in $TAG: $SITE$page"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" > /dev/null || true
          done

      # On the PRs of this job's plan, or of `plan`'s when it failed before planning again.
      - name: Report a failure
        if: failure() && steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          REASON: ${{ steps.plan.outputs.reason || steps.apply.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          plan=$(cat "$RUNNER_TEMP/plan.json" 2> /dev/null || printf '%s' "$FIRST_PLAN")
          if [ -n "$REASON" ]; then
            body="Not released: $REASON. Release with \`pnpm release\` by hand once that is sorted out (docs/deployment.md)."
          elif [ -n "$TAG" ]; then
            body="The release failed: $RUN_URL. $TAG was tagged and pushed, but its deploy did not succeed: fix it in a new commit and release with \`pnpm release\` (never move a tag), or re-run the deploy run once its cause is gone."
          else
            body="The release failed: $RUN_URL. Nothing was tagged or published. Fix it and release with \`pnpm release\` (docs/deployment.md)."
          fi
          for pr in $(jq -r '.pulls[].number' <<< "$plan"); do
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$body"
          done

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.release.outputs.tag }}
          OUTCOME: ${{ job.status }}
        run: |
          plan=$(cat "$RUNNER_TEMP/plan.json" 2> /dev/null || printf '%s' "$FIRST_PLAN")
          {
            echo "## Content release"
            echo
            jq -r '(.reason // empty), (.pulls[]? | "- PR #\(.number) (\(.kind), \(.branch)): \(.artifacts | length) artifact(s)")' <<< "$plan"
            echo
            echo "Release: ${TAG:-not tagged}, $OUTCOME."
          } >> "$GITHUB_STEP_SUMMARY"
