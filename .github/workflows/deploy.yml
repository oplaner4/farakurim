# Deploys a release: pushing a tag vX.Y.Z (made by `pnpm release`) checks and builds the tagged commit and deploys
# out/ to https://farakurim.cz/. The tag must match package.json and be on main. A release made with
# `pnpm release --local` is already deployed from the maintainer's machine: its commit carries the trailer
# `Release-Deploy: local`, and this workflow then only says so.
# Uploaded files (/uploads/) are not in git: `pnpm release` uploads them from the local uploads/ folder before it
# pushes the tag, and the deploy stops if the build links a file that is not on the server yet.
# The SSH target, web root, rsync flags, server-only folders and verify checks live in scripts/deploy.sh, which
# `pnpm release --local` uses too. The runner image and the actions are pinned (actions by commit SHA, updated by
# Dependabot), so a release only changes when this file does.

name: Deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      local: ${{ steps.tag.outputs.local }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the check needs origin/main
          persist-credentials: false # no later step pushes or fetches

      - name: Check the release tag
        id: tag
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version). Release with pnpm release."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Push main together with the tag."
            exit 1
          fi
          if [ "$(git log -1 --format='%(trailers:key=Release-Deploy,valueonly)' "$GITHUB_SHA")" = local ]; then
            echo "::notice::$GITHUB_REF_NAME was deployed from the maintainer's machine (pnpm release --local)."
            echo "local=true" >> "$GITHUB_OUTPUT"
          fi

  # The same check as pushes and pull requests (check.yml), plus the build with the production keys as the artifact
  # `out`.
  check:
    needs: release
    if: needs.release.outputs.local != 'true'
    uses: ./.github/workflows/check.yml
    with:
      release: true

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    # One deploy at a time; a newer release waits for the running one instead of cancelling it mid-sync.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: Production
      url: https://farakurim.cz/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/deploy.sh # only the deploy script; out/ comes from the check
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: out
          path: out/

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The host key is public, so it may be a variable; the private key must be a secret.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS || vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Set DEPLOY_SSH_KEY (secret) and DEPLOY_KNOWN_HOSTS in the Production environment."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Check that every linked upload is on the server
        env:
          # On unless the Production environment sets CHECK_UPLOADS to false.
          CHECK_UPLOADS: ${{ vars.CHECK_UPLOADS }}
        run: |
          if [ "$CHECK_UPLOADS" = "false" ]; then
            echo "::warning::CHECK_UPLOADS is false: the linked uploads were not checked on the server."
            exit 0
          fi
          scripts/deploy.sh check-uploads

      - name: Deploy out/
        run: scripts/deploy.sh out

      - name: Verify
        run: scripts/deploy.sh verify
