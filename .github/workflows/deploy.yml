# Deploys a release: pushing a tag vX.Y.Z (made by `pnpm release`) checks and builds the tagged commit and deploys
# out/ to https://farakurim.cz/. The tag must match package.json and be on main. A release made with
# `pnpm release --local` is already deployed from the maintainer's machine: its commit carries the trailer
# `Release-Deploy: local`, and this workflow then only says so.
# The site is static, so what depends on the date (the year, the prerendered calendars, the next mass without JS)
# ages with the build. A scheduled run rebuilds and redeploys the latest release tag when the last deploy (on the
# Production environment, or a --local release's commit) is 7 days old: the hosting's cron dispatches it on its
# schedule with refresh=due (cron-scripts/deploy.php; GitHub's own schedule starts runs hours late). Running the
# workflow by hand (refresh=now, the default) does it now.
# A refresh publishes nothing new: the tag was released, so it needs no yes. It always builds, a --local tag too.
# Uploaded files are not in git: `pnpm release` uploads them from the local staging folder before it
# pushes the tag, and the deploy stops if the build links a file that is not on the server yet.
# The calendar sync (pnpm calendar-sync, Události and Bohoslužby each with --calendar) runs in its own
# job after the deploy and its verify: on a release tag it applies the changes, on a refresh it only previews them in
# the run summary. It has its own environment (calendar-sync), never Production (the refresh counts Production
# deployments), signs in to Google with workload identity federation (no key), and a failure only warns: the deploy is
# not affected and the next release catches up. Each calendar applies only once its repository variable
# (EVENTS_CALENDAR_SYNC, SERVICES_CALENDAR_SYNC) is true, which the maintainer sets after the first apply by hand
# (docs/deployment.md).
# The SSH target, web root, rsync flags, server-only folders and verify checks live in scripts/deploy.sh, which
# `pnpm release --local` uses too. The runner image and the actions are pinned (actions by commit SHA, updated by
# Dependabot), so a release only changes when this file does.

name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      refresh:
        description: "now: deploy the latest release now; due: only when the last deploy is 7 days old"
        type: choice
        options: [now, due]
        default: now

permissions:
  contents: read

# The site: SITE_URL (src/content/site.ts); a test checks it.
env:
  SITE: https://farakurim.cz

jobs:
  # Picks what to deploy: the pushed tag, or on a refresh the latest tag on main if it is due.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read # the last Production deploy
    outputs:
      deploy: ${{ steps.tag.outputs.deploy || steps.refresh.outputs.deploy }}
      ref: ${{ steps.tag.outputs.ref || steps.refresh.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the check needs origin/main and the tags
          persist-credentials: false # no later step pushes or fetches

      - name: Check the release tag
        id: tag
        if: github.event_name == 'push'
        run: |
          echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version). Release with pnpm release."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Push main together with the tag."
            exit 1
          fi
          if [ "$(git log -1 --format='%(trailers:key=Release-Deploy,valueonly)' "$GITHUB_SHA")" = local ]; then
            echo "::notice::$GITHUB_REF_NAME was deployed from the maintainer's machine (pnpm release --local)."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the release to refresh
        id: refresh
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: 7
          REFRESH: ${{ inputs.refresh }}
        run: |
          tags=$(git tag --list 'v*' --merged origin/main --sort=-v:refname)
          tag=${tags%%$'\n'*}
          if [ -z "$tag" ]; then
            echo "::error::No release tag on main."
            exit 1
          fi
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          if [ "$REFRESH" != due ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A --local release has no Production deployment: its release commit dates its deploy.
          last=$(git log -1 --format=%ct "$tag")
          while read -r id created; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = success ]; then
              at=$(date -d "$created" +%s)
              if [ "$at" -gt "$last" ]; then last=$at; fi
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=30" \
            --jq '.[] | "\(.id) \(.created_at)"')
          age=$(( ($(date +%s) - last) / 86400 ))
          if [ "$age" -lt "$MAX_AGE_DAYS" ]; then
            echo "::notice::The last deploy is $age days old; $tag is refreshed after $MAX_AGE_DAYS."
          else
            echo "::notice::The last deploy is $age days old: refreshing $tag."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  # The same check as pushes and pull requests (check.yml), plus the build with the production keys as the artifact
  # `out`.
  check:
    needs: release
    if: needs.release.outputs.deploy == 'true'
    uses: ./.github/workflows/check.yml
    with:
      release: true
      ref: ${{ needs.release.outputs.ref }}

  deploy:
    needs: [release, check]
    runs-on: ubuntu-24.04
    # A hung SSH or rsync would otherwise hold the production group for GitHub's default 6 hours.
    timeout-minutes: 20
    # One deploy at a time; a newer release waits for the running one instead of cancelling it mid-sync.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: Production
      url: ${{ env.SITE }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.ref }}
          sparse-checkout: scripts/deploy.sh # only the deploy script; out/ comes from the check
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out/

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The host key is public, so it may be a variable; the private key must be a secret.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS || vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Set DEPLOY_SSH_KEY (secret) and DEPLOY_KNOWN_HOSTS in the Production environment."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Check that every linked upload is on the server
        env:
          # On unless the Production environment sets CHECK_UPLOADS to false.
          CHECK_UPLOADS: ${{ vars.CHECK_UPLOADS }}
        run: |
          if [ "$CHECK_UPLOADS" = "false" ]; then
            echo "::warning::CHECK_UPLOADS is false: the linked uploads were not checked on the server."
            exit 0
          fi
          scripts/deploy.sh check-uploads

      - name: Deploy out/
        run: scripts/deploy.sh out

      - name: Verify
        run: scripts/deploy.sh verify

  # Keeps the Události calendar in line with the events once the site is live (every URL it writes is a live page). It
  # acts as the service account through workload identity federation (no key): only this job, in this environment, may
  # ask GitHub for the OIDC token Google trusts, away from the build and from Production.
  calendar:
    needs: [release, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the OIDC token for Google's workload identity federation
    timeout-minutes: 10
    continue-on-error: true # a failed sync must not mark the release failed
    # One sync at a time: two releases close together would otherwise both add the same events.
    concurrency:
      group: calendar-sync
      cancel-in-progress: false
    environment: calendar-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.ref }}
          persist-credentials: false # no later step pushes or fetches

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Writes the federated credentials file for the sync; the environment variables stay unset, so nothing else uses it.
      - name: Authenticate to Google Cloud
        id: google
        if: github.event_name == 'push' && (vars.EVENTS_CALENDAR_SYNC == 'true' || vars.SERVICES_CALENDAR_SYNC == 'true')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_CALENDAR_SERVICE_ACCOUNT_EMAIL }}
          export_environment_variables: false
        continue-on-error: true # warned below, like a failed sync

      - name: Warn that Google refused the sign-in
        if: steps.google.outcome == 'failure'
        run: echo "::warning::The calendar sync could not sign in to Google (see the step above); the next release catches up."

      - name: Apply the Události calendar sync
        if: steps.google.outcome == 'success' && vars.EVENTS_CALENDAR_SYNC == 'true'
        env:
          GOOGLE_CALENDAR_SERVICE_ACCOUNT: ${{ steps.google.outputs.credentials_file_path }}
        # The lines go to the log and the run summary; a failure warns with the last line of stderr.
        run: |
          out="$RUNNER_TEMP/calendar-sync-events.out"
          err="$RUNNER_TEMP/calendar-sync-events.err"
          status=0
          pnpm --silent calendar-sync --calendar events --apply > "$out" 2> "$err" || status=$?
          cat "$out"
          { echo '```text'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            cat "$err" >&2
            echo "::warning::The Události calendar sync failed ($(tail -n 1 "$err")); the next release catches up."
          fi

      - name: Apply the Bohoslužby calendar sync
        if: steps.google.outcome == 'success' && vars.SERVICES_CALENDAR_SYNC == 'true'
        env:
          GOOGLE_CALENDAR_SERVICE_ACCOUNT: ${{ steps.google.outputs.credentials_file_path }}
        # As the Události apply above.
        run: |
          out="$RUNNER_TEMP/calendar-sync-services.out"
          err="$RUNNER_TEMP/calendar-sync-services.err"
          status=0
          pnpm --silent calendar-sync --calendar services --apply > "$out" 2> "$err" || status=$?
          cat "$out"
          { echo '```text'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            cat "$err" >&2
            echo "::warning::The Bohoslužby calendar sync failed ($(tail -n 1 "$err")); the next release catches up."
          fi

      - name: Preview the Události calendar sync
        if: github.event_name != 'push' || vars.EVENTS_CALENDAR_SYNC != 'true'
        env:
          NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ vars.GOOGLE_CALENDAR_API_KEY }}
        # As the apply above: the lines go to the run summary, a failure warns.
        run: |
          out="$RUNNER_TEMP/calendar-sync-events.out"
          err="$RUNNER_TEMP/calendar-sync-events.err"
          status=0
          pnpm --silent calendar-sync --calendar events > "$out" 2> "$err" || status=$?
          { echo '```text'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            cat "$err" >&2
            echo "::warning::The Události calendar preview failed ($(tail -n 1 "$err"))."
          fi

      - name: Preview the Bohoslužby calendar sync
        if: github.event_name != 'push' || vars.SERVICES_CALENDAR_SYNC != 'true'
        env:
          NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ vars.GOOGLE_CALENDAR_API_KEY }}
        # As the Události preview above.
        run: |
          out="$RUNNER_TEMP/calendar-sync-services.out"
          err="$RUNNER_TEMP/calendar-sync-services.err"
          status=0
          pnpm --silent calendar-sync --calendar services > "$out" 2> "$err" || status=$?
          { echo '```text'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            cat "$err" >&2
            echo "::warning::The Bohoslužby calendar preview failed ($(tail -n 1 "$err"))."
          fi

      # Each line that needs a person warns, after the apply or the preview: in Události an `ask:` or meetings it cannot
      # pair (that event stays out of the calendar until a person acts and the next release runs), in Bohoslužby a
      # hand-made event that doubles a service, which the sync never touches.
      - name: Warn about what needs a person in the calendars
        if: ${{ !cancelled() }}
        env:
          NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ vars.GOOGLE_CALENDAR_API_KEY }}
        run: pnpm --silent calendar-sync --problems 2> /dev/null | sed 's/^/::warning::/' || true
