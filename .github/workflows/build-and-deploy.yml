# Verifies every push and pull request. Pushing a release tag (vX.Y.Z, made by the farnost-deploy skill with
# `pnpm version`) also deploys the built site (out/) to http://2026.farakurim.cz/; pushes to main are only a backup,
# and the main push of a release commit is skipped because its tag run checks the same commit.
# Pushes and pull requests that only change docs (Markdown, design/, agent skills and rules) do not run; path filters
# do not apply to tags, so a release always runs every check, including Prettier on the Markdown.
# Uploaded files (/uploads/) are not in git: they are still uploaded from a local uploads/ folder (farnost-deploy),
# and the deploy stops if the build links a file that is not on the server yet.
# The runner image and the actions are pinned (actions by commit SHA, updated by Dependabot), so a release only
# changes when this file does.
# Keep in sync with .claude/skills/farnost-deploy/SKILL.md: SSH target, web root, rsync flags, excludes, verify checks.

name: Build and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: &docs-only
      - "**.md"
      - "design/**"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    paths-ignore: *docs-only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SSH_TARGET: farakurim_cz@91.239.200.63
  WEB_ROOT: /2026.farakurim.cz

jobs:
  build:
    # A release pushes main and its tag together (`git push origin main --follow-tags`), so the same commit would
    # build twice. The release commit (`chore(release): vX.Y.Z`, made by `pnpm version`) is checked by the tag run.
    if: >-
      !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
      && startsWith(github.event.head_commit.message, 'chore(release): v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release check needs origin/main
          persist-credentials: false # no later step pushes or fetches

      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version). Release with farnost-deploy."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Push main together with the tag."
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prettier --check .
      - run: pnpm test
      - run: pnpm lint
      # A fresh checkout has no .next/types (PageProps, LayoutProps, RouteContext) or next-env.d.ts:
      # next dev and next build generate them locally, next typegen does it without building.
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit

      - run: pnpm build
        env:
          # Without the key the calendars ship mock data. A repository variable: the key is public in the built JS,
          # and this job has no environment, so it could not read the Production environment's values.
          NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ vars.GOOGLE_CALENDAR_API_KEY }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: out
          path: out/
          include-hidden-files: true # out/.htaccess
          retention-days: 7

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # One deploy at a time; a newer release waits for the running one instead of cancelling it mid-sync.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: Production
      url: http://2026.farakurim.cz/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: out
          path: out/

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The host key is public, so it may be a variable; the private key must be a secret.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS || vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Set DEPLOY_SSH_KEY (secret) and DEPLOY_KNOWN_HOSTS in the Production environment."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Check that every linked upload is on the server
        env:
          # On unless the Production environment sets CHECK_UPLOADS to false.
          CHECK_UPLOADS: ${{ vars.CHECK_UPLOADS }}
        run: |
          if [ "$CHECK_UPLOADS" = "false" ]; then
            echo "::warning::CHECK_UPLOADS is false: the linked uploads were not checked on the server."
            exit 0
          fi
          grep -rhoE '/uploads/[A-Za-z0-9._/%-]+\.[A-Za-z0-9]+' out | sort -u > linked.txt
          ssh "$SSH_TARGET" "cd $WEB_ROOT && find uploads -type f" | sed 's|^|/|' | sort -u > on-server.txt
          comm -23 linked.txt on-server.txt > missing.txt
          if [ -s missing.txt ]; then
            echo "::error::The build links files that are not in $WEB_ROOT/uploads/ yet. Upload them first (farnost-deploy):"
            cat missing.txt
            exit 1
          fi
          echo "All $(wc -l < linked.txt) linked uploads are on the server."

      # --delete keeps the web root equal to the build; the three folders live only on the server.
      - name: Deploy out/
        run: |
          rsync -az --itemize-changes --delete \
            --exclude=/uploads/ --exclude=/virtualni_prohlidka/ --exclude=/cache/ \
            --chmod=D755,F644 \
            out/ "$SSH_TARGET:$WEB_ROOT/"

      - name: Verify
        run: |
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "$1"); echo "$code $1"; [ "$code" = "$2" ]; }
          check http://2026.farakurim.cz/ 200
          check http://2026.farakurim.cz/neexistuje/ 404
          # The tour is copied to the server once (farnost-deploy); without it only the footer link breaks.
          check http://2026.farakurim.cz/virtualni_prohlidka/ 200 || echo "::warning::The virtual tour is missing on the server."
