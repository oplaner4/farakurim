# Opens a pull request with the week's service sheet from the parish's e-mail (docs/content-pipelines.md "Service sheet by
# e-mail"). On each run of the hosting's cron it reads the unseen mail of the service sheet mailbox over IMAP
# (`pnpm sheet-mail`): only the parish's DKIM-signed message with one DOCX is a sheet. Two parts of the mail are
# optional: a date in the subject names the week to handle (else the DOCX's newest week; a reply's or forward's
# subject names none), and the mail's new text is
# the sender's note, which the agent checks the draft against (never a source of content).
# Two jobs, so that no step holding a secret runs code from a workspace the agent has touched:
# - `sheet` fetches the mail and lets the agent (workload identity federation, no API key) run the
#   service sheet skills unattended on the DOCX: it drafts, corrects and stages the weeks and writes a report. The
#   agent's file tools may write only in $RUNNER_TEMP/sheet (the checkout is denied); only `pnpm stage sheet` writes
#   src/content/ and the staging folder. The job hands on the report, the change to src/content/ as a patch and the staged PDFs
#   as a one-day artifact. The year's DOCX (intentions with names) and the note never leave this job: they are not
#   uploaded, cached or logged, and they are deleted at the end.
# - `publish` starts from a fresh checkout, applies the patch only if it touches nothing but src/content/*.json, then
#   commits as the GitHub App's bot and opens or updates the one service-sheet/* PR, its body the report (ended by a
#   `<!-- report-end -->` line, so a comment fix can replace the report), a draft while the report has a blocking
#   question (an update turns it back into one). It neither tests nor builds: check.yml does that on every commit the
#   App pushes, and a red check is fixed with a `/fix` comment (content-fix-run.yml) or a commit. It has no
#   id-token, so it cannot act as the agent. It uploads the staged PDFs as `content-uploads-<sha>` before it pushes the
#   commit, so no pushed commit lacks them.
# The maintainer's merge releases the site (content-release.yml), with the staged PDFs from the artifacts of the PR's
# commits (`content-uploads-<sha>`, the PDFs under porady_bohosluzeb/ as in the staging folder). Nothing changed: no PR. The mail is filed (Zpracováno, Odmítnuto) only once its outcome is done, so
# a run that breaks retries the sheet on the next run. Both jobs run in the environment `service-sheet-publish` (the
# IMAP login; the federation rule matches it, but only `sheet` has an id-token). The App key is the repository secret
# CONTENT_APP_PRIVATE_KEY, shared with content-release.yml; a secret reaches only the steps that name it. The
# job summary and the failure (refused week, document error, a parish message without exactly one DOCX, a subject
# naming a week the DOCX does not have, a superseded mail naming another week, a subject naming an older week when
# nothing changed) tell the maintainer; no e-mail is sent. The runner image and the actions are pinned (actions by
# commit SHA).

name: Service sheet

on:
  # The hosting's cron dispatches it on its schedule (docs/hosting.md "Starting the workflows on time"): GitHub's own
  # schedule starts runs 4 to 8 hours late.
  workflow_dispatch:

# One run at a time; a run started meanwhile waits, so two runs never read the same mail.
concurrency:
  group: service-sheet
  cancel-in-progress: false

permissions:
  contents: read

# The copies a test checks: the folder of the uploaded files (UPLOADS_PATH in src/lib/shared/uploads.ts) and of the
# sheet PDFs in it (SHEETS_FOLDER in src/lib/services/service-sheet.ts), without their slashes.
env:
  UPLOADS: uploads
  SHEETS: porady_bohosluzeb

jobs:
  sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 75 # The agent's step has 45 of them
    environment: service-sheet-publish
    permissions:
      contents: read
      pull-requests: read # find the open sheet PR
      id-token: write # The agent's workload identity federation
    # The uids and the summary come from the fetch step, which ran before the agent's: they are not read back from files
    # the agent could have changed.
    outputs:
      fetched: ${{ steps.fetch.outputs.fetched }}
      docx: ${{ steps.fetch.outputs.docx }}
      sheet: ${{ steps.fetch.outputs.sheet }}
      no_week: ${{ steps.fetch.outputs.no_week }}
      unhandled: ${{ steps.fetch.outputs.unhandled }}
      skipped: ${{ steps.fetch.outputs.skipped }}
      superseded: ${{ steps.fetch.outputs.superseded }}
      rejected: ${{ steps.fetch.outputs.rejected }}
      no_docx: ${{ steps.fetch.outputs.no_docx }}
      summary: ${{ steps.fetch.outputs.summary }}
      pr: ${{ steps.branch.outputs.pr }}
      branch: ${{ steps.branch.outputs.branch }}
      base: ${{ steps.branch.outputs.base }}
      agent: ${{ steps.agent.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the sheet PR's branch and the names taken
          persist-credentials: false # nothing here pushes

      - uses: ./.github/actions/setup

      # The outcome is one JSON document on stdout (--silent keeps pnpm's banner out of it); it holds uids, dates,
      # weeks and kinds, never message text. The DOCX lands in $RUNNER_TEMP/sheet/mail/porad.docx, the sender's note
      # (if any) in $RUNNER_TEMP/sheet/mail/note.txt, mail.json in $RUNNER_TEMP/run (the artifact's folder, outside
      # the agent's reach). A named week reaches the prompt only as two ISO dates.
      - name: Fetch the mail
        id: fetch
        env:
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/sheet" "$RUNNER_TEMP/run"
          mail="$RUNNER_TEMP/run/mail.json"
          pnpm --silent sheet-mail fetch --out "$RUNNER_TEMP/sheet/mail" > "$mail"
          jq -r '
            "docx=\(.docx // "")",
            "sheet=\(.sheetUid // "")",
            "week_from=\(.week.validFrom // "" | select(test("^([0-9]{4}-[0-9]{2}-[0-9]{2})?$")))",
            "week_to=\(.week.validTo // "" | select(test("^([0-9]{4}-[0-9]{2}-[0-9]{2})?$")))",
            "skipped=\(if .newest then "\(.newest.validFrom) – \(.newest.validTo)" else "" end)",
            "note=\(if .note then "true" else "" end)",
            "superseded=\(.superseded | map(tostring) | join(","))",
            "rejected=\(.rejected + .noDocx + .noWeek | map(tostring) | join(","))",
            "no_docx=\(.noDocx | length)",
            "no_week=\(.noWeek | length)",
            "unhandled=\(.unhandled | length)",
            "summary=\(.summary | tojson)",
            "date=\([.summary[] | select(contains(": sheet (newest)")) | .[0:10]] | first // "")"
          ' "$mail" >> "$GITHUB_OUTPUT"
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      - name: Install LibreOffice and poppler
        if: steps.fetch.outputs.docx != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils

      # At most one open sheet PR: a later e-mail adds a commit to its branch, so service-sheets.json never conflicts.
      # Only a branch of this repo counts (a fork's PR can carry any branch name). A new branch is named after the
      # newest sheet's date (Prague time), the run's date if it has none.
      - name: Check out the sheet branch
        id: branch
        if: steps.fetch.outputs.docx != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MAIL_DATE: ${{ steps.fetch.outputs.date }}
        run: |
          # A failing lookup fails the step: a second PR would conflict with the open one.
          found=$(gh pr list --state open --json headRefName,number,isCrossRepository --jq '
            [.[] | select((.isCrossRepository | not) and (.headRefName | startswith("service-sheet/")))]
            | first | select(.) | "\(.number) \(.headRefName)"')
          pr="" branch=""
          if [ -n "$found" ]; then read -r pr branch <<< "$found"; fi
          if [ -n "$pr" ]; then
            git checkout -B "$branch" "origin/$branch"
            # The report of the earlier runs, so the agent keeps its question ids. The conversation is locked: only
            # collaborators can edit this body.
            gh pr view "$pr" --json body --jq .body > "$RUNNER_TEMP/sheet/previous-report.md"
          else
            date="$MAIL_DATE"
            if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then date=$(TZ=Europe/Prague date +%F); fi
            # A closed PR's branch may still be there: a second branch the same day gets a suffix.
            branch="service-sheet/$date"
            n=2
            while git show-ref --quiet --verify "refs/remotes/origin/$branch"; do
              branch="service-sheet/$date-$n"
              n=$((n + 1))
            done
          fi
          {
            echo "pr=$pr"
            echo "branch=$branch"
            echo "base=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The prompt holds no sheet rules: they live in the skills. What the agent may do: .github/actions/agent.
      - name: Run the service sheet skills
        id: agent
        if: steps.fetch.outputs.docx != ''
        timeout-minutes: 45
        uses: oplaner4/farakurim/.github/actions/agent@main # from main, not the checkout: see the action
        with:
          workdir: ${{ runner.temp }}/sheet
          commands: pnpm stage sheet:*
          federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          prompt: |
            The parish sent its service sheet DOCX: ${{ runner.temp }}/sheet/mail/porad.docx.
            ${{ steps.fetch.outputs.week_from != '' && format('The week to handle: {0} to {1} (`--from {0} --to {1}`).', steps.fetch.outputs.week_from, steps.fetch.outputs.week_to) || 'The week to handle: the DOCX''s newest.' }}
            ${{ steps.fetch.outputs.note == 'true' && format('The sender''s note: {0}/sheet/mail/note.txt.', runner.temp) || 'The sender wrote no note.' }}
            Run the service sheet skills unattended (their "Unattended run" section). The report file is
            ${{ runner.temp }}/sheet/report.md and the scratchpad is ${{ runner.temp }}/sheet.
            The previous report of this PR, if present: ${{ runner.temp }}/sheet/previous-report.md.
            The skills hold all the run needs: don't read README.md, docs/ or design/.

      # What `publish` needs, never the DOCX: the report, the change to src/content/ against the branch head (new
      # files included) and the staged files that really are PDFs.
      - name: Collect the outcome
        if: always() && steps.fetch.outputs.fetched == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          run="$RUNNER_TEMP/run"
          printf '%s\n' "$BRANCH" > "$run/branch"
          if [ -f "$RUNNER_TEMP/sheet/report.md" ]; then cp "$RUNNER_TEMP/sheet/report.md" "$run/report.md"; fi
          git add --intent-to-add -- src/content
          git diff --binary HEAD -- src/content > "$run/content.patch"
          mkdir -p "$run/uploads/$SHEETS"
          for file in "$UPLOADS/$SHEETS"/*.pdf; do
            if [ -f "$file" ] && [ "$(head -c 4 "$file")" = "%PDF" ]; then cp "$file" "$run/uploads/$SHEETS/"; fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.fetch.outputs.fetched == 'true'
        with:
          name: service-sheet-run-${{ github.run_id }}
          path: ${{ runner.temp }}/run/
          if-no-files-found: error
          retention-days: 1

      - name: Delete the DOCX and the note
        if: always()
        run: rm -rf "$RUNNER_TEMP/sheet"

  publish:
    needs: sheet
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: service-sheet-publish
    permissions:
      contents: read # the push and the PR use the App token
    steps:
      # Missing when `sheet` failed before handing on: this job then only reports, and files nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true
        with:
          name: service-sheet-run-${{ github.run_id }}
          path: ${{ runner.temp }}/run/

      # A fresh checkout of the commit the agent's change is based on: nothing from `sheet`'s workspace runs here. Also
      # when the download failed, for the summary.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sheet.outputs.base || 'main' }}
          persist-credentials: false # only the push step gets a token

      - uses: ./.github/actions/setup

      # `pnpm content-pr apply` checks the report against the patch (each week exactly one `Outcome:` line; a change
      # needs a week created or corrected, no change a week corrected, refused or a document error) and applies the
      # patch only if it touches nothing but src/content/*.json and every week it adds or changes has its heading
      # (created, or created or corrected); otherwise it fails and nothing is applied or filed. It names the commit
      # after the weeks, and an open blocking question makes a draft whatever `blocking:` says.
      - name: Apply the change
        id: changes
        if: steps.download.outcome == 'success' && needs.sheet.result == 'success' && needs.sheet.outputs.docx != ''
        env:
          BRANCH: ${{ needs.sheet.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          run="$RUNNER_TEMP/run"
          if ! result=$(pnpm --silent content-pr apply --kind sheet "$run/report.md" "$run/content.patch"); then
            echo "::error::The report or the change was not accepted (see above): the sheet stays unread."
            exit 1
          fi
          changed=$(jq -r .changed <<< "$result")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" != true ]; then exit 0; fi
          git checkout -B "$BRANCH"
          {
            echo "draft=$(jq -r .draft <<< "$result")"
            echo "message=$(jq -r .message <<< "$result")"
          } >> "$GITHUB_OUTPUT"
          pnpm --silent content-pr body --kind sheet --run-url "$RUN_URL" "$run/report.md" > "$run/pr-body.md"

      # Commits, uploads the staged files, pushes and opens or updates the PR (.github/actions/content-pr).
      - name: Open or update the PR
        id: pr
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/content-pr
        with:
          client-id: ${{ vars.CONTENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_APP_PRIVATE_KEY }}
          paths: src/content
          message: ${{ steps.changes.outputs.message }}
          uploads: ${{ runner.temp }}/run/uploads/
          branch: ${{ needs.sheet.outputs.branch }}
          pr: ${{ needs.sheet.outputs.pr }}
          draft: ${{ steps.changes.outputs.draft }}
          body-file: ${{ runner.temp }}/run/pr-body.md
          reviewers: ${{ vars.CONTENT_REVIEWERS }}

      # `pnpm content-pr summary`: dates, kinds, weeks and the script's messages only, never the e-mail's text. Fails
      # the job when something needs the maintainer without a PR: a refused week, a document error, a parish message
      # without one DOCX, a subject naming a week the DOCX does not have, an older message naming another week than
      # the one handled, a subject naming an older week when nothing changed.
      - name: Summary
        if: always()
        env:
          FETCHED: ${{ needs.sheet.outputs.fetched }}
          SUMMARY: ${{ needs.sheet.outputs.summary }}
          HANDLED: ${{ needs.sheet.outputs.docx }}
          JOB_RESULT: ${{ needs.sheet.result }}
          AGENT: ${{ needs.sheet.outputs.agent }}
          DOWNLOAD: ${{ steps.download.outcome }}
          APPLY: ${{ steps.changes.outcome }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          PR_ACTION: ${{ steps.pr.outputs.action }}
          PR_URL: ${{ steps.pr.outputs.url }}
          NO_DOCX: ${{ needs.sheet.outputs.no_docx }}
          NO_WEEK: ${{ needs.sheet.outputs.no_week }}
          UNHANDLED: ${{ needs.sheet.outputs.unhandled }}
          SKIPPED: ${{ needs.sheet.outputs.skipped }}
        run: pnpm --silent content-pr summary --kind sheet "$RUNNER_TEMP/run/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Only once the outcome is done (PR opened or updated, nothing changed, or the problem in the summary) and only
      # when `sheet` succeeded; otherwise the sheet and the superseded mail stay unseen for the next run. The rejected
      # mail is filed whenever `sheet` handed on its outcome.
      - name: File the mail
        if: always() && steps.download.outcome == 'success'
        env:
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          DONE: >-
            ${{ needs.sheet.result == 'success' && (needs.sheet.outputs.docx == '' || (steps.changes.outcome == 'success'
            && (steps.changes.outputs.changed == 'false' || steps.pr.outcome == 'success'))) }}
          SHEET: ${{ needs.sheet.outputs.sheet }}
          SUPERSEDED: ${{ needs.sheet.outputs.superseded }}
          REJECTED: ${{ needs.sheet.outputs.rejected }}
        run: |
          processed=""
          if [ "$DONE" = true ]; then
            processed=$(printf '%s\n' "$SHEET" "$SUPERSEDED" | grep -v '^$' | paste -sd, || true)
          fi
          if [ -z "$processed$REJECTED" ]; then
            echo "No mail to file."
            exit 0
          fi
          pnpm --silent sheet-mail file --processed="$processed" --rejected="$REJECTED"
