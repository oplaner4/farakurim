# Opens a pull request with the week's service sheet from the parish's e-mail (docs/deployment.md "Service sheet by
# e-mail"). On each run of the hosting's cron it reads the unseen mail of the service sheet mailbox over IMAP
# (`pnpm sheet-mail`): only the parish's DKIM-signed message with one DOCX is a sheet.
# Two jobs, so that no step holding a secret runs code from a workspace Claude has touched:
# - `sheet` fetches the mail and lets Claude (claude-code-action, workload identity federation, no API key) run the
#   service sheet skills unattended on the DOCX: it drafts, corrects and stages the weeks and writes a report. Claude's
#   file tools may write only in $RUNNER_TEMP/sheet (the checkout is denied); only `pnpm stage sheet` writes
#   src/content/ and the staging folder. The job hands on the report, the change to src/content/ as a patch and the staged PDFs
#   as a one-day artifact. The year's DOCX (intentions with names) never leaves this job: it is not uploaded, cached
#   or logged, and it is deleted at the end.
# - `publish` starts from a fresh checkout, applies the patch only if it touches nothing but src/content/*.json, then
#   tests, builds, commits as the GitHub App's bot and opens or updates the one service-sheet/* PR, its body the
#   report, a draft while the report has a blocking question (an update turns it back into one). It has no id-token,
#   so it cannot act as Claude.
# The maintainer's merge releases the site (service-sheet-release.yml), with the staged PDFs from the artifacts of
# the PR's commits. Nothing changed: no PR. The mail is filed (Zpracováno, Odmítnuto) only once its outcome is done, so
# a run that breaks retries the sheet on the next run. Both jobs run in the environment `service-sheet-publish` (the
# IMAP login; the federation rule matches it, but only `sheet` has an id-token). The App key is the repository secret
# CONTENT_APP_PRIVATE_KEY, shared with service-sheet-release.yml; a secret reaches only the steps that name it. The
# job summary and the failure (refused week, document error, a parish message without exactly one DOCX) tell the
# maintainer; no e-mail is sent. The runner image and the actions are pinned (actions by
# commit SHA).

name: Service sheet

on:
  # The hosting's cron dispatches it on its schedule (cron-scripts/service-sheet.php): GitHub's own schedule starts runs
  # 4 to 8 hours late.
  workflow_dispatch:

# One run at a time; a run started meanwhile waits, so two runs never read the same mail.
concurrency:
  group: service-sheet
  cancel-in-progress: false

permissions:
  contents: read

# The copies a test checks: the folder of the uploaded files (UPLOADS_PATH in src/lib/shared/uploads.ts) and of the
# sheet PDFs in it (SHEETS_FOLDER in src/lib/services/service-sheet.ts), without their slashes.
env:
  UPLOADS: uploads
  SHEETS: porady_bohosluzeb

jobs:
  sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 75 # Claude's step has 45 of them
    environment: service-sheet-publish
    permissions:
      contents: read
      pull-requests: read # find the open sheet PR
      id-token: write # Claude's workload identity federation
    # The uids and the summary come from the fetch step, which ran before Claude's: they are not read back from files
    # Claude could have changed.
    outputs:
      fetched: ${{ steps.fetch.outputs.fetched }}
      docx: ${{ steps.fetch.outputs.docx }}
      sheet: ${{ steps.fetch.outputs.sheet }}
      superseded: ${{ steps.fetch.outputs.superseded }}
      rejected: ${{ steps.fetch.outputs.rejected }}
      no_docx: ${{ steps.fetch.outputs.no_docx }}
      summary: ${{ steps.fetch.outputs.summary }}
      pr: ${{ steps.branch.outputs.pr }}
      branch: ${{ steps.branch.outputs.branch }}
      base: ${{ steps.branch.outputs.base }}
      claude: ${{ steps.claude.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the sheet PR's branch and the names taken
          persist-credentials: false # nothing here pushes

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The outcome is one JSON document on stdout (--silent keeps pnpm's banner out of it); it holds uids, dates and
      # kinds, never message text. The DOCX lands in $RUNNER_TEMP/sheet/mail/porad.docx, mail.json in
      # $RUNNER_TEMP/run (the artifact's folder, outside Claude's reach).
      - name: Fetch the mail
        id: fetch
        env:
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/sheet" "$RUNNER_TEMP/run"
          mail="$RUNNER_TEMP/run/mail.json"
          pnpm --silent sheet-mail fetch --out "$RUNNER_TEMP/sheet/mail" > "$mail"
          jq -r '
            "docx=\(.docx // "")",
            "sheet=\(.sheetUid // "")",
            "superseded=\(.superseded | map(tostring) | join(","))",
            "rejected=\(.rejected + .noDocx | map(tostring) | join(","))",
            "no_docx=\(.noDocx | length)",
            "summary=\(.summary | tojson)",
            "date=\([.summary[] | select(endswith(": sheet (newest)")) | .[0:10]] | first // "")"
          ' "$mail" >> "$GITHUB_OUTPUT"
          echo "fetched=true" >> "$GITHUB_OUTPUT"

      - name: Install LibreOffice and poppler
        if: steps.fetch.outputs.docx != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils

      # At most one open sheet PR: a later e-mail adds a commit to its branch, so service-sheets.json never conflicts.
      # Only a branch of this repo counts (a fork's PR can carry any branch name). A new branch is named after the
      # newest sheet's date (Prague time), the run's date if it has none.
      - name: Check out the sheet branch
        id: branch
        if: steps.fetch.outputs.docx != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MAIL_DATE: ${{ steps.fetch.outputs.date }}
        run: |
          # A failing lookup fails the step: a second PR would conflict with the open one.
          found=$(gh pr list --state open --json headRefName,number,isCrossRepository --jq '
            [.[] | select((.isCrossRepository | not) and (.headRefName | startswith("service-sheet/")))]
            | first | select(.) | "\(.number) \(.headRefName)"')
          pr="" branch=""
          if [ -n "$found" ]; then read -r pr branch <<< "$found"; fi
          if [ -n "$pr" ]; then
            git checkout -B "$branch" "origin/$branch"
            # The report of the earlier runs, so Claude keeps its question ids. The conversation is locked: only
            # collaborators can edit this body.
            gh pr view "$pr" --json body --jq .body > "$RUNNER_TEMP/sheet/previous-report.md"
          else
            date="$MAIL_DATE"
            if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then date=$(TZ=Europe/Prague date +%F); fi
            # A closed PR's branch may still be there: a second branch the same day gets a suffix.
            branch="service-sheet/$date"
            n=2
            while git show-ref --quiet --verify "refs/remotes/origin/$branch"; do
              branch="service-sheet/$date-$n"
              n=$((n + 1))
            done
          fi
          {
            echo "pr=$pr"
            echo "branch=$branch"
            echo "base=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The prompt holds no sheet rules: they live in the skills. Claude can read files, write with its file tools in
      # $RUNNER_TEMP/sheet only (an `Edit(...)` rule covers Write too; the deny on the checkout wins over any allow, so
      # it cannot change scripts, package.json, node_modules, hooks or .git), stage the sheet and read PDFs to stdout
      # only (pdftotext writes the file a second argument names, which no Edit rule checks); no git, no network. A
      # rule's `//` marks an absolute path (runner.temp starts with `/`). github.token (read-only) keeps the action from
      # fetching its own App token; the action's output stays out of the public log.
      - name: Run the service sheet skills
        id: claude
        if: steps.fetch.outputs.docx != ''
        timeout-minutes: 45
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          github_token: ${{ github.token }}
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          show_full_output: false
          display_report: false
          claude_args: |
            --model claude-opus-5-5
            --add-dir ${{ runner.temp }}/sheet
            --allowedTools "Read,Edit(/${{ runner.temp }}/sheet/**),Bash(pnpm stage sheet:*),Bash(pdftotext -layout * -),Bash(ls:*),Bash(cat:*)"
            --disallowedTools "WebFetch,WebSearch,NotebookEdit,Edit(./**)"
          prompt: |
            The parish sent its service sheet DOCX: ${{ runner.temp }}/sheet/mail/porad.docx.
            Run the service sheet skills unattended (their "Unattended run" section). The report file is
            ${{ runner.temp }}/sheet/report.md and the scratchpad is ${{ runner.temp }}/sheet.
            The previous report of this PR, if present: ${{ runner.temp }}/sheet/previous-report.md; the new report
            carries it over as that section says.
            Handle the DOCX's newest week only, with parish-create-service-sheet: create it when it is not in
            src/content/service-sheets.json, else correct it as that section says. Leave older weeks alone. A week
            the script refuses or cannot draft goes into the report.

      # What `publish` needs, never the DOCX: the report, the change to src/content/ against the branch head (new
      # files included) and the staged files that really are PDFs.
      - name: Collect the outcome
        if: always() && steps.fetch.outputs.fetched == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          run="$RUNNER_TEMP/run"
          printf '%s\n' "$BRANCH" > "$run/branch"
          if [ -f "$RUNNER_TEMP/sheet/report.md" ]; then cp "$RUNNER_TEMP/sheet/report.md" "$run/report.md"; fi
          git add --intent-to-add -- src/content
          git diff --binary HEAD -- src/content > "$run/content.patch"
          mkdir -p "$run/pdf"
          for file in "$UPLOADS/$SHEETS"/*.pdf; do
            if [ -f "$file" ] && [ "$(head -c 4 "$file")" = "%PDF" ]; then cp "$file" "$run/pdf/"; fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.fetch.outputs.fetched == 'true'
        with:
          name: service-sheet-run-${{ github.run_id }}
          path: ${{ runner.temp }}/run/
          if-no-files-found: error
          retention-days: 1

      - name: Delete the DOCX
        if: always()
        run: rm -rf "$RUNNER_TEMP/sheet"

  publish:
    needs: sheet
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: service-sheet-publish
    permissions:
      contents: read # the push and the PR use the App token
    env:
      # Reads `Outcome:` lines tolerantly: drops a list marker and bold around `Outcome:` (`- **Outcome:** created`,
      # `**Outcome: corrected**`), so every check sees `Outcome: <outcome>`.
      OUTCOME_SED: >-
        s/^[[:space:]]*[-*][[:space:]]+//; s/^\*\*(Outcome:[^*]*)\*\*/\1/; s/^\*\*Outcome\*\*:/Outcome:/;
        s/^Outcome:[[:space:]]*/Outcome: /
    steps:
      # Missing when `sheet` failed before handing on: this job then only reports, and files nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true
        with:
          name: service-sheet-run-${{ github.run_id }}
          path: ${{ runner.temp }}/run/

      # A fresh checkout of the commit Claude's change is based on: nothing from `sheet`'s workspace runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.download.outcome == 'success'
        with:
          ref: ${{ needs.sheet.outputs.base || 'main' }}
          persist-credentials: false # only the push step gets a token

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.download.outcome == 'success'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.download.outcome == 'success'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.download.outcome == 'success'
        run: pnpm install --frozen-lockfile

      # The report: line 1 `blocking: yes|no`, line 2 `commit: <message>`, then the PR body. On every path each week
      # (a `## ` section other than `## Mirror in the calendar`) has exactly one `Outcome:` line, else nothing is applied
      # or filed. With a change, the patch is applied only if it touches nothing but src/content/*.json. Without one,
      # the report must explain it: a valid first line and the week corrected (a correction of a week not released
      # yet can change nothing), refused or a document error (the last two fail the summary).
      - name: Apply the change
        id: changes
        if: steps.download.outcome == 'success' && needs.sheet.result == 'success' && needs.sheet.outputs.docx != ''
        env:
          BRANCH: ${{ needs.sheet.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          run="$RUNNER_TEMP/run"
          report="$run/report.md"
          patch="$run/content.patch"
          first=$(sed -n 1p "$report" 2>/dev/null || true)
          normalized=$(sed -E "$OUTCOME_SED" "$report" 2>/dev/null || true)
          weeks=$(awk '
            function done() { if (week != "" && week != "Mirror in the calendar") print n "\t" week }
            /^## / { done(); week = substr($0, 4); n = 0; next }
            /^Outcome: / { n++ }
            END { done() }' <<< "$normalized")
          if [ ! -s "$report" ] || [ -z "$weeks" ] || grep -qv $'^1\t' <<< "$weeks"; then
            echo "::error::The report does not give each week exactly one Outcome line: the sheet stays unread."
            exit 1
          fi
          outcomes=$(grep '^Outcome: ' <<< "$normalized" || true)
          if [ ! -s "$patch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if ! [[ "$first" =~ ^blocking:\ (yes|no)$ ]] \
              || grep -qvE '^Outcome: (corrected$|refused: |document error: )' <<< "$outcomes"; then
              echo "::error::Nothing changed, but the report does not explain why: the sheet stays unread."
              exit 1
            fi
            exit 0
          fi
          bad=$(git apply --numstat "$patch" | cut -f3- | grep -vE '^src/content/[^/]+\.json$' || true)
          if [ -n "$bad" ] || git apply --summary "$patch" | grep -q ' mode 120000'; then
            echo "::error::The change touches more than src/content/*.json: not applied."
            exit 1
          fi
          git apply "$patch"
          git checkout -B "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          message=$(sed -n 2p "$report" 2>/dev/null | sed 's/^commit: //' || true)
          if [ -z "$message" ] || ! printf '%s\n' "$message" | pnpm exec commitlint > /dev/null; then
            echo "::warning::The report has no valid commit message: using the default."
            message="feat(content): update the service sheets"
          fi
          # Only an exact `blocking: no` opens a ready PR, so a broken report cannot be merged by mistake.
          echo "draft=$([ "$first" = "blocking: no" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "message=$message" >> "$GITHUB_OUTPUT"
          {
            tail -n +3 "$report"
            echo
            echo "---"
            echo
            echo "Opened by the service sheet workflow (\`service-sheet.yml\`). Squash merge to publish: the merge releases the site."
            echo "The staged PDFs are in the artifact \`service-sheet-pdf-<sha>\` of each commit; this run: $RUN_URL"
          } > "$run/pr-body.md"

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: pnpm test

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ vars.GOOGLE_CALENDAR_API_KEY }}
        run: pnpm build

      - name: Create the App token
        id: app
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CONTENT_APP_ID }}
          private-key: ${{ secrets.CONTENT_APP_PRIVATE_KEY }}
          # Not all of the App's permissions: the push, and opening, editing and locking the PR.
          permission-contents: write
          permission-pull-requests: write

      # src/content/ only: the staged PDF is in the staging folder, which git ignores. No hooks (the message is checked
      # already), never a force-push: a branch moved since `sheet` rejects the push and the sheet is retried.
      - name: Commit and push
        id: commit
        if: steps.changes.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BRANCH: ${{ needs.sheet.outputs.branch }}
          MESSAGE: ${{ steps.changes.outputs.message }}
        run: |
          bot="${APP_SLUG}[bot]"
          id=$(GH_TOKEN="$TOKEN" gh api "/users/$bot" --jq .id)
          git add -- src/content
          git -c core.hooksPath=/dev/null -c user.name="$bot" -c user.email="$id+$bot@users.noreply.github.com" \
            commit -m "$MESSAGE"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.commit.outcome == 'success'
        with:
          name: service-sheet-pdf-${{ steps.commit.outputs.sha }}
          path: ${{ runner.temp }}/run/pdf/*.pdf
          if-no-files-found: warn
          retention-days: 30

      # The conversation is locked (the repo is public): only collaborators with write access can comment. An update
      # also refreshes the title, and a report that is not exactly `blocking: no` turns the PR back into a draft, so a
      # new blocking question cannot be merged; otherwise the draft state stays (the maintainer marks it ready).
      - name: Open or update the PR
        id: pr
        if: steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ needs.sheet.outputs.pr }}
          BRANCH: ${{ needs.sheet.outputs.branch }}
          MESSAGE: ${{ steps.changes.outputs.message }}
          DRAFT: ${{ steps.changes.outputs.draft }}
        run: |
          body="$RUNNER_TEMP/run/pr-body.md"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$MESSAGE" --body-file "$body"
            if [ "$DRAFT" != false ] && [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" != true ]; then
              gh pr ready --undo "$PR"
            fi
            url=$(gh pr view "$PR" --json url --jq .url)
            echo "action=updated" >> "$GITHUB_OUTPUT"
          else
            draft=()
            if [ "$DRAFT" != false ]; then draft=(--draft); fi
            url=$(gh pr create --base main --head "$BRANCH" --title "$MESSAGE" --body-file "$body" "${draft[@]}")
            echo "action=opened" >> "$GITHUB_OUTPUT"
          fi
          issue="repos/$GITHUB_REPOSITORY/issues/${url##*/}"
          if [ "$(gh api "$issue" --jq .locked)" != true ]; then gh api -X PUT "$issue/lock" -f lock_reason=resolved; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Dates, kinds, weeks and the script's messages only, never the e-mail's text. Fails the job when something
      # needs the maintainer without a PR: a refused week, a document error, a parish message without one DOCX.
      - name: Summary
        if: always()
        env:
          FETCHED: ${{ needs.sheet.outputs.fetched }}
          SUMMARY: ${{ needs.sheet.outputs.summary }}
          DOCX: ${{ needs.sheet.outputs.docx }}
          NO_DOCX: ${{ needs.sheet.outputs.no_docx }}
          SHEET_RESULT: ${{ needs.sheet.result }}
          CLAUDE: ${{ needs.sheet.outputs.claude }}
          DOWNLOAD: ${{ steps.download.outcome }}
          APPLY: ${{ steps.changes.outcome }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          PR_ACTION: ${{ steps.pr.outputs.action }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          report="$RUNNER_TEMP/run/report.md"
          failed=$(sed -E "$OUTCOME_SED" "$report" 2>/dev/null \
            | awk '/^## / { week = substr($0, 4) } /^Outcome: (refused|document error)/ { print "- " week ": " $0 }' \
            || true)
          {
            echo "## Service sheet"
            echo
            if [ "$FETCHED" != true ]; then
              echo "The mail could not be read."
            elif [ "$(jq 'length' <<< "$SUMMARY")" = 0 ]; then
              echo "No new mail."
            else
              jq -r '.[] | "- " + .' <<< "$SUMMARY"
            fi
            echo
            if [ -n "$DOCX" ]; then
              if [ "$CLAUDE" != success ]; then
                echo "Claude's run failed: the sheet stays unread and the next run retries it."
              elif [ "$SHEET_RESULT" != success ] || [ "$DOWNLOAD" != success ]; then
                echo "The sheet job failed after Claude's run (see the log): the sheet stays unread for the next run."
              elif [ "$APPLY" != success ]; then
                echo "The change or the report was not accepted (see the log): the sheet stays unread for the next run."
              elif [ "$CHANGED" = false ]; then
                echo "Nothing changed: no PR."
              elif [ "$PR_OUTCOME" = success ]; then
                echo "PR $PR_ACTION: $PR_URL"
              else
                echo "The test, build, commit or PR failed (see the log): the sheet stays unread for the next run."
              fi
            fi
            if [ -n "$failed" ]; then
              echo
              echo "Weeks not published:"
              echo "$failed"
            fi
            if [ "${NO_DOCX:-0}" != 0 ]; then
              echo
              echo "$NO_DOCX message(s) from the parish had no DOCX or several: ask the parish for the sheet."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ] || [ "${NO_DOCX:-0}" != 0 ]; then
            echo "::error::A week was refused, a document error occurred or a parish message had no single DOCX."
            exit 1
          fi

      # Only once the outcome is done (PR opened or updated, nothing changed, or the problem in the summary) and only
      # when `sheet` succeeded; otherwise the sheet and the superseded mail stay unseen for the next run. The rejected
      # mail is filed whenever `sheet` handed on its outcome.
      - name: File the mail
        if: always() && steps.download.outcome == 'success'
        env:
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          DONE: >-
            ${{ needs.sheet.result == 'success' && (needs.sheet.outputs.docx == '' || (steps.changes.outcome == 'success'
            && (steps.changes.outputs.changed == 'false' || steps.pr.outcome == 'success'))) }}
          SHEET: ${{ needs.sheet.outputs.sheet }}
          SUPERSEDED: ${{ needs.sheet.outputs.superseded }}
          REJECTED: ${{ needs.sheet.outputs.rejected }}
        run: |
          processed=""
          if [ "$DONE" = true ]; then
            processed=$(printf '%s\n' "$SHEET" "$SUPERSEDED" | grep -v '^$' | paste -sd, || true)
          fi
          if [ -z "$processed$REJECTED" ]; then
            echo "No mail to file."
            exit 0
          fi
          pnpm --silent sheet-mail file --processed="$processed" --rejected="$REJECTED"
