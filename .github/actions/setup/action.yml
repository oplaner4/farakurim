# Installs pnpm, Node (the version in .nvmrc, with pnpm's store cached) and the locked dependencies, in a checkout made
# before (a local action runs from it). Used by the content workflows (service-sheet.yml, events.yml,
# content-fix-run.yml, content-release.yml), which check out main or a content branch made after it. check.yml and
# deploy.yml keep their own steps: a refresh deploy checks out the latest release tag, which may predate this action.

name: Setup
description: Install pnpm, Node from .nvmrc and the locked dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile
