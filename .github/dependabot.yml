# Opens a pull request when a pinned GitHub Action (.github/workflows/) has a new release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release must be a week old before it is proposed, so a compromised one has time to be pulled.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
